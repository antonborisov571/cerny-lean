name = "cerny"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Cerny"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.36.0"

[[lean_lib]]
name = "Cerny"
allowNonModules = true
